name: Build Open RV Windows with ProRes
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      SCCACHE_GHA_ENABLED: 'false'
    steps:
    - name: Check out build configuration
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: builder
    - name: Check out official Open RV 4.0.2
      shell: pwsh
      run: '

        $ErrorActionPreference = ''Stop''

        if (Test-Path -LiteralPath ''D:\rv'') { throw ''Expected a fresh D:\rv checkout'' }

        git -c core.longpaths=true clone --branch v4.0.2 --depth 1 --recurse-submodules --shallow-submodules https://github.com/AcademySoftwareFoundation/OpenRV.git
        D:\rv

        if ($LASTEXITCODE -ne 0) { throw ''Official source clone failed'' }

        $actualCommit = git -C D:\rv rev-parse HEAD

        if ($actualCommit.Trim() -ne ''27db5464a90ca19a9a30d540988ee109ee06bb7e'') { throw ''Unexpected source commit'' }

        Write-Output "Verified official source commit: $actualCommit"

        '
    - name: Install MSVC components 14.40.17.10.x86.x64
      run: "Set-Location \"C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\\"\n$InstallPath = \"C:\\Program Files\\Microsoft Visual\
        \ Studio\\2022\\Enterprise\"\n$componentsToRemove= @(\n  \"Microsoft.VisualStudio.Component.VC.14.40.17.10.x86.x64\"\n  \"Microsoft.VisualStudio.Component.VC.14.40.17.10.x86.x64.Spectre\"\
        \n)\n[string]$workloadArgs = $componentsToRemove | ForEach-Object {\" --add \" +  $_}\n$Arguments = ('/c', \"vs_installer.exe\", 'modify',\
        \ '--installPath', \"`\"$InstallPath`\"\",$workloadArgs, '--quiet', '--norestart', '--nocache')\n# should be run twice\n$process = Start-Process\
        \ -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden\n$process = Start-Process -FilePath cmd.exe -ArgumentList\
        \ $Arguments -Wait -PassThru -WindowStyle Hidden\n"
      shell: powershell
      working-directory: D:/rv
    - name: Set up MSVC 14.40.33807
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 14.40.33807
        arch: x86_64
    - name: Setup msys2 and install dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: false
        install: mingw-w64-x86_64-autotools mingw-w64-x86_64-cmake mingw-w64-x86_64-cmake-cmcldeps mingw-w64-x86_64-glew mingw-w64-x86_64-libarchive
          mingw-w64-x86_64-make mingw-w64-x86_64-meson mingw-w64-x86_64-toolchain autoconf automake bison flex git libtool nasm p7zip patch unzip
          zip
    - name: Activate Python 3.11
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
      with:
        python-version: '3.11'
    - name: Display Python installation location
      run: python -c "import sys; print(sys.executable)"
      shell: powershell
      working-directory: D:/rv
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e
      with:
        toolchain: stable
    - name: Cache CMake for Windows
      uses: actions/cache@v4
      id: windows-cmake-cache
      with:
        path: C:/Program Files/CMake
        key: ${{ runner.os }}-cmake-3.31.6
    - name: Install CMake 3.31.6 with chocolatey
      if: steps.windows-cmake-cache.outputs.cache-hit != 'true'
      run: choco install cmake --version=3.31.6 --allow-downgrade --yes
      shell: powershell
      working-directory: D:/rv
    - name: Install JOM (parallel nmake)
      run: choco install jom --yes
      shell: powershell
      working-directory: D:/rv
    - name: Set PATH environment variable
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"


        python_dir=$(cygpath -u "$pythonLocation")

        echo "export PATH=\"/c/Program Files/CMake/bin:$python_dir:/c/msys64/mingw64/bin:\$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools\""
        >> ~/.bash_profile

        '
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Set ACLOCAL_PATH environment variable
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        echo "export ACLOCAL_PATH=/c/msys64/usr/share/aclocal" >> ~/.bash_profile

        '
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Add Rust to PATH for msys2
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        echo "export PATH=\"/c/Users/runneradmin/.cargo/bin:\$PATH\"" >> ~/.bash_profile

        '
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Display environment variables
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        echo $PATH

        echo $ACLOCAL_PATH

        which python

        which python3

        which cmake

        rustc --version || echo "WARNING: Rust not found in msys2 PATH"

        cargo --version || echo "WARNING: Cargo not found in msys2 PATH"

        '
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Prepare Qt folder
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        mkdir -p /c/qt'
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Install Qt 6.5.3
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.5.3
        host: windows
        target: desktop
        arch: win64_msvc2019_64
        dir: c:/
        install-deps: 'false'
        modules: debug_info qt3d qt5compat qtactiveqt qtcharts qtconnectivity qtdatavis3d qtgrpc qthttpserver qtimageformats qtlanguageserver
          qtlocation qtlottie qtmultimedia qtnetworkauth qtpdf qtpositioning qtquick3d qtquick3dphysics qtquickeffectmaker qtquicktimeline qtremoteobjects
          qtscxml qtsensors qtserialbus qtserialport qtshadertools qtspeech qtvirtualkeyboard qtwebchannel qtwebengine qtwebsockets qtwebview
        archives: d3dcompiler_47 opengl32sw qtbase qtdeclarative qtsvg qttools qttranslations
        cache: false
        setup-python: 'false'
        tools: tools_qtcreator
        set-env: 'true'
        tools-only: 'false'
        aqtversion: ==3.2.*
    - name: Install Python dependencies
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        python -m pip install --user --upgrade -r ./requirements.txt'
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.6
      with:
        version: v0.8.1
    - name: Configure sccache for msys2
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        echo "export PATH=\"/c/Users/runneradmin/.cargo/bin:\$PATH\"" >> ~/.bash_profile

        sccache --version || echo "WARNING: sccache not found in PATH"

        '
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Restore previous dependency build
      id: deps-cache
      uses: actions/cache/restore@v4
      with:
        path: D:/rv/_build
        key: openrv-402-win1440-prores-dnxhd-short-v2-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openrv-402-win1440-prores-dnxhd-short-v2-
          openrv-402-win1440-prores-short-v1-
    - name: Configure OpenRV
      run: 'set -o pipefail


        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        cmake --version 2>&1 | tee /d/rv-configure.log

        export QT_HOME=c:/Qt/6.5.3/msvc2019_64

        cmake -B _build -G "Visual Studio 17 2022" -A x64 -T v143,version=14.40 -DRV_DEPS_WIN_PERL_ROOT=c:/Strawberry/perl/bin -DCMAKE_BUILD_TYPE=Release
        -DRV_DEPS_QT_LOCATION=$QT_HOME -DRV_VFX_PLATFORM=CY2025 ''-DRV_FFMPEG_NON_FREE_DECODERS_TO_ENABLE=prores;aac;aac_fixed;aac_latm;dnxhd'' 2>&1
        | tee /d/rv-configure.log


        '
      shell: msys2 {0}
      working-directory: D:/rv
      id: configure
    - name: Build OpenRV dependencies
      run: 'set -o pipefail


        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        cmake --build _build --config Release --target dependencies --parallel=$(python -c ''import os; print(os.cpu_count())'') -v 2>&1 | tee
        /d/rv-dependencies.log

        '
      shell: msys2 {0}
      id: build_deps
      working-directory: D:/rv
    - name: Build OpenRV main executable
      run: 'set -o pipefail


        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        cmake --build _build --config Release --target main_executable --parallel=$(python -c ''import os; print(os.cpu_count())'') -v 2>&1 |
        tee /d/rv-main.log

        '
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Tests
      continue-on-error: true
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        ls -al _build/stage/app/bin

        ctest --test-dir _build -C Release --extra-verbose

        '
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Install OpenRV
      run: '

        source ~/.bash_profile

        python_dir=$(cygpath -u "$pythonLocation")

        msvc_bin=$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")

        export PATH="$msvc_bin:/c/Program Files/CMake/bin:$python_dir:$python_dir/Scripts:/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Users/runneradmin/.cargo/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools"

        export ACLOCAL_PATH=/usr/share/aclocal

        export WIN_PYTHON_DIR="$pythonLocation"

        cmake --install _build --prefix $(pwd)/_install --config Release'
      shell: msys2 {0}
      working-directory: D:/rv
    - name: Verify packaged codecs
      shell: pwsh
      run: python builder/verify.py D:/rv/_install
    - name: Upload portable Windows build
      uses: actions/upload-artifact@v4
      with:
        name: OpenRV-4.0.2-Windows-x64-ProRes-AAC-DNx
        path: D:/rv/_install/
        if-no-files-found: error
        retention-days: 7
    - name: Upload diagnostic logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-diagnostics
        path: 'D:/rv-configure.log

          D:/rv-dependencies.log

          D:/rv-main.log

          D:/rv/_build/CMakeCache.txt

          D:/rv/_build/CMakeFiles/CMakeConfigureLog.yaml'
        if-no-files-found: ignore
        retention-days: 7
    - name: Save dependency build for subsequent runs
      if: always() && steps.configure.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: D:/rv/_build
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}
'on':
  workflow_dispatch: null
